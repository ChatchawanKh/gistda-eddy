# Render Blueprint สำหรับ Auth API (server/auth) — แพ็กเกจฟรี
# ค่าที่เป็น sync: false ต้องกรอกเองใน Render Dashboard (ค่าลับ ห้าม commit)
services:
  - type: web
    name: gistda-fluxsuite-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server/auth
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REMEMBER_ME_EXPIRES_IN
        value: 30d
      - key: SESSION_EXPIRES_IN
        value: 1d
      - key: ENFORCE_EMAIL_DOMAIN
        value: "true"
      - key: ALLOWED_EMAIL_DOMAIN
        value: gistda.or.th
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
